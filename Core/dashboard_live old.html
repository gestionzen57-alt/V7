<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerFlow V6 — Cockpit</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
:root {
  --text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;
  --font-body:'Satoshi','Inter',sans-serif;
  --font-mono:'JetBrains Mono','Fira Code','Consolas',monospace;
  --transition:200ms cubic-bezier(.16,1,.3,1);
  --bg:#0d0e10;--surface:#13151a;--surface-2:#181b22;--surface-3:#1e2230;
  --border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.14);
  --text:#d4d8e2;--text-muted:#7a8099;--text-faint:#3d4257;
  --compressed:#ff4444;--active:#ff8800;--neutral:#f0c040;
  --hollow:#5577aa;--dead:#3a3f55;
  --live:#22dd88;--delayed:#ff8800;--stale:#ff4444;--accent:#4f98a3;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-sm);color:var(--text);background:var(--bg);line-height:1.5}
.cockpit{display:grid;grid-template-rows:auto auto 1fr auto;min-height:100dvh}
.header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-6);background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:var(--space-3)}
.logo-text{font-size:var(--text-base);font-weight:700;letter-spacing:.08em}
.logo-sub{font-size:var(--text-xs);color:var(--text-muted);letter-spacing:.12em;font-family:var(--font-mono)}
.header-right{display:flex;align-items:center;gap:var(--space-4)}
.db-badge{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border-radius:var(--radius-xl);font-family:var(--font-mono);font-size:var(--text-xs);font-weight:500;border:1px solid transparent}
.db-badge.LIVE{color:var(--live);border-color:rgba(34,221,136,.25);background:rgba(34,221,136,.08)}
.db-badge.DELAYED{color:var(--delayed);border-color:rgba(255,136,0,.25);background:rgba(255,136,0,.08)}
.db-badge.STALE,.db-badge.ERROR{color:var(--stale);border-color:rgba(255,68,68,.25);background:rgba(255,68,68,.08)}
.db-dot{width:6px;height:6px;border-radius:50%}
.LIVE .db-dot{background:var(--live);animation:pdot 2s ease-in-out infinite}
.DELAYED .db-dot,.STALE .db-dot,.ERROR .db-dot{background:var(--stale)}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.refresh-btn{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:var(--text-xs);cursor:pointer;transition:background var(--transition),color var(--transition)}
.refresh-btn:hover{background:var(--surface-3);color:var(--text)}
.loading-bar{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:sweep 1.2s ease-in-out infinite}
@keyframes sweep{0%{background-position:-100% 0}100%{background-position:200% 0}}
.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);padding:var(--space-4) var(--space-6);align-items:start}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border)}
.card-title{font-size:var(--text-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);font-family:var(--font-mono)}
.card-body{padding:var(--space-4)}
.full-width{grid-column:1 / -1}
.field-line{display:flex;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);margin-bottom:var(--space-2);border:1px solid var(--border);background:var(--surface-2)}
.field-label{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:700;color:var(--accent);min-width:150px;flex-shrink:0;letter-spacing:.04em;padding-top:1px}
.field-value{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text);line-height:1.6;word-break:break-word}
.temporal-block{margin-top:var(--space-3);padding:var(--space-3);background:rgba(79,152,163,.05);border:1px solid rgba(79,152,163,.15);border-radius:var(--radius-lg)}
.temporal-title{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--accent);font-weight:700;letter-spacing:.1em;margin-bottom:var(--space-2)}
.temporal-text{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted);line-height:1.7;white-space:pre-wrap}
.density-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--space-3)}
.density-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);transition:border-color var(--transition),transform var(--transition)}
.density-card:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.density-currency{font-family:var(--font-mono);font-size:var(--text-base);font-weight:700}
.state-badge{display:inline-flex;align-items:center;padding:2px var(--space-2);border-radius:var(--radius-xl);font-family:var(--font-mono);font-size:.62rem;font-weight:700;letter-spacing:.06em;width:fit-content}
.s-COMPRESSED{background:rgba(255,68,68,.15);color:var(--compressed);border:1px solid rgba(255,68,68,.3)}
.s-ACTIVE{background:rgba(255,136,0,.15);color:var(--active);border:1px solid rgba(255,136,0,.3)}
.s-NEUTRAL{background:rgba(240,192,64,.12);color:var(--neutral);border:1px solid rgba(240,192,64,.25)}
.s-HOLLOW{background:rgba(85,119,170,.15);color:var(--hollow);border:1px solid rgba(85,119,170,.3)}
.s-DEAD{background:rgba(58,63,85,.3);color:var(--dead);border:1px solid rgba(58,63,85,.5)}
.score-bar-wrap{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.score-bar{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.f-COMPRESSED{background:var(--compressed)}.f-ACTIVE{background:var(--active)}
.f-NEUTRAL{background:var(--neutral)}.f-HOLLOW{background:var(--hollow)}.f-DEAD{background:var(--dead)}
.score-text{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted);text-align:right}
.raw-pre{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted);line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:380px;overflow-y:auto}
.empty-state{display:flex;flex-direction:column;align-items:center;padding:var(--space-10) var(--space-8);text-align:center;color:var(--text-muted)}
.empty-state h3{color:var(--text);margin-bottom:var(--space-2)}
.empty-state p{font-family:var(--font-mono);font-size:var(--text-xs);max-width:50ch;line-height:1.6}
.footer{padding:var(--space-3) var(--space-6);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface)}
.footer-ts{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-faint)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
</style>
</head>
<body>
<div class="cockpit">
<header class="header">
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      <rect x="2" y="2" width="28" height="28" rx="6" fill="rgba(79,152,163,.12)" stroke="rgba(79,152,163,.4)" stroke-width="1"/>
      <path d="M8 20 L13 12 L17 17 L21 10 L24 14" stroke="#4f98a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="14" r="2.5" fill="#4f98a3"/>
    </svg>
    <div><div class="logo-text">POWERFLOW</div><div class="logo-sub">V6 COCKPIT</div></div>
  </div>
  <div class="header-right">
    <div id="dbBadge" class="db-badge LIVE"><div class="db-dot"></div><span id="dbLabel">...</span></div>
    <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
  </div>
</header>
<div id="loadingBar" style="display:none" class="loading-bar"></div>
<main><div class="main-grid" id="mainGrid"></div></main>
<footer class="footer">
  <span class="footer-ts" id="footerTs">—</span>
  <span class="footer-ts">PowerFlow V6 — Read Only</span>
</footer>
</div>
<script>
const SL={COMPRESSED:'COMPRESSE',ACTIVE:'ACTIF',NEUTRAL:'NEUTRE',HOLLOW:'CREUX',DEAD:'MORT'};
const FL={dominant:'CHAMP DOMINANT',coalition:'COALITION',context:'CONTEXTE OPPOSE',contested_window:'FENETRE CONTESTEE',bipolar_focus:'BIPOLAIRE FOCUS',bipolar_list:'BIPOLAIRES'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtTs(ts){try{const d=new Date(ts);return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' — '+d.toLocaleDateString('fr-FR');}catch{return ts||'—'}}
function renderField(f){
  if(!f)return'<div style="color:var(--text-faint);font-family:var(--font-mono);font-size:var(--text-xs);padding:1rem;text-align:center">Aucune donnee.</div>';
  let h='',ok=false;
  for(const k of['dominant','coalition','context','contested_window','bipolar_focus','bipolar_list']){
    const v=f[k];if(!v||!v.trim())continue;ok=true;
    h+=`<div class="field-line"><div class="field-label">${FL[k]||k}</div><div class="field-value">${esc(v)}</div></div>`;
  }
  if(!ok)h='<div style="color:var(--text-faint);font-family:var(--font-mono);font-size:var(--text-xs);padding:1rem;text-align:center">Hors session ou DB stale.</div>';
  if(f.temporal_patterns&&f.temporal_patterns.trim())
    h+=`<div class="temporal-block"><div class="temporal-title">TEMPORAL PATTERNS</div><div class="temporal-text">${esc(f.temporal_patterns)}</div></div>`;
  return h;
}
function renderDensity(d){
  if(!d||!Object.keys(d).length)return'<div style="color:var(--text-faint);font-family:var(--font-mono);font-size:var(--text-xs);text-align:center;padding:1rem">Non disponible.</div>';
  let h='<div class="density-grid">';
  for(const[c,v]of Object.entries(d).sort((a,b)=>b[1].score-a[1].score)){
    const st=v.state||'DEAD',sc=parseFloat(v.score||0),pct=Math.round(sc*100);
    h+=`<div class="density-card"><div class="density-currency">${esc(c)}</div><div class="state-badge s-${st}">${SL[st]||st}</div><div class="score-bar-wrap"><div class="score-bar f-${st}" style="width:${pct}%"></div></div><div class="score-text">${sc.toFixed(2)}</div></div>`;
  }
  return h+'</div>';
}
function renderGrid(data){
  const raw=data.cockpit_raw||'';
  document.getElementById('mainGrid').innerHTML=`
    <div class="card full-width">
      <div class="card-header"><span class="card-title">Cockpit Field</span><span class="card-title" style="color:var(--text-faint);font-size:.6rem">CHAMP GLOBAL</span></div>
      <div class="card-body">${renderField(data.field)}</div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Densite Temporelle</span><span class="card-title" style="color:var(--text-faint);font-size:.6rem">M5 · 20 BARRES</span></div>
      <div class="card-body">${renderDensity(data.density)}</div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Output Brut</span><span class="card-title" style="color:var(--text-faint);font-size:.6rem">COCKPIT RAW</span></div>
      <div class="card-body"><pre class="raw-pre">${raw.trim()?esc(raw):'<span style="color:var(--text-faint)">Vide.</span>'}</pre></div>
    </div>`;
  const b=document.getElementById('dbBadge');
  b.className='db-badge '+(data.db_status||'ERROR');
  document.getElementById('dbLabel').textContent=data.db_label||data.db_status;
  document.getElementById('footerTs').textContent='Mis a jour : '+fmtTs(data.timestamp);
}
function renderError(msg){
  document.getElementById('mainGrid').innerHTML=`<div class="card full-width"><div class="card-body"><div class="empty-state"><h3>Cockpit hors ligne</h3><p>${esc(msg)}</p></div></div></div>`;
  document.getElementById('dbBadge').className='db-badge ERROR';
  document.getElementById('dbLabel').textContent='Hors ligne';
}
async function loadDashboard(){
  const lb=document.getElementById('loadingBar');lb.style.display='block';
  try{const r=await fetch('./dashboard_data.json?_='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);renderGrid(await r.json());}
  catch(e){renderError('Lancer : python dashboard_server.py --once — '+e.message);}
  finally{lb.style.display='none'}
}
loadDashboard();
setInterval(loadDashboard,10000);
</script>
</body>
</html>
