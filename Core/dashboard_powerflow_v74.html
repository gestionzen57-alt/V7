<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>PowerFlow V7.4 - Final Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #07090d;
      --panel: #111722;
      --panel2: #151d2b;
      --text: #e8edf5;
      --muted: #93a2b7;
      --line: #263246;
      --hot: #ffb020;
      --wake: #ff4d4d;
      --watch: #4da3ff;
      --ok: #2fd17c;
      --bad: #ff6b6b;
      --neutral: #a3aab8;
      --purple: #b084ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Segoe UI, Arial, sans-serif;
      line-height: 1.35;
    }

    header {
      padding: 22px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(7,9,13,.92);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: .08em;
    }

    .sub {
      color: var(--muted);
      margin-top: 6px;
      font-size: 13px;
    }

    main {
      padding: 22px;
      display: grid;
      gap: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
    }

    .span-12 { grid-column: span 12; }
    .span-8 { grid-column: span 8; }
    .span-6 { grid-column: span 6; }
    .span-4 { grid-column: span 4; }

    h2 {
      margin: 0 0 14px;
      font-size: 16px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #cbd7ea;
    }

    h3 {
      margin: 12px 0 8px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .bigline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid var(--line);
      background: #0c111b;
      color: var(--text);
      white-space: nowrap;
    }

    .badge.wake { color: var(--wake); border-color: rgba(255,77,77,.5); }
    .badge.watch { color: var(--watch); border-color: rgba(77,163,255,.5); }
    .badge.hot { color: var(--hot); border-color: rgba(255,176,32,.5); }
    .badge.ok { color: var(--ok); border-color: rgba(47,209,124,.5); }
    .badge.bad { color: var(--bad); border-color: rgba(255,107,107,.5); }
    .badge.purple { color: var(--purple); border-color: rgba(176,132,255,.5); }

    .kv {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 8px 14px;
      font-size: 14px;
      margin-top: 8px;
    }

    .k { color: var(--muted); }
    .v { color: var(--text); font-weight: 600; }

    .phrase {
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
      margin: 8px 0 16px;
    }

    ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }

    li { margin: 5px 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: .04em;
    }

    .muted { color: var(--muted); }
    .mono { font-family: Consolas, monospace; font-size: 12px; }
    .small { font-size: 12px; }

    .weight {
      height: 8px;
      background: #0a0f18;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--line);
      min-width: 80px;
    }

    .bar {
      height: 100%;
      background: #4da3ff;
      width: 0%;
    }

    .error {
      color: var(--bad);
      font-weight: 700;
    }

    .statusbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 12px rgba(47,209,124,.8);
      display: inline-block;
    }

    .footer {
      color: var(--muted);
      font-size: 12px;
      padding: 10px 0 30px;
      text-align: center;
    }

    @media (max-width: 980px) {
      .span-8, .span-6, .span-4 { grid-column: span 12; }
      .kv { grid-template-columns: 1fr; }
      header { position: relative; }
    }
  </style>

<style id="pf75c-session-compact-style">
.session-memory-card details {
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 14px;
  margin-top: 12px;
  padding: 10px 12px;
  background: rgba(15, 23, 42, 0.35);
}
.session-memory-card summary {
  cursor: pointer;
  font-weight: 800;
  letter-spacing: .05em;
  color: #dbeafe;
}
.session-memory-card .mini-note {
  color: #94a3b8;
  font-size: 12px;
  margin-left: 8px;
}
.session-memory-card table {
  margin-top: 10px;
}
.session-memory-card .review-line {
  margin-top: 8px;
  color: #94a3b8;
  font-size: 12px;
}
</style>

</head>

<body>
<header>
  <h1>POWERFLOW V7.4 — FINAL DASHBOARD</h1>
  <div class="sub">Lecture finale du flux : phase, gravité, contre-respiration, preuves, profils temps.</div>
</header>

<main>
  <section class="grid">
    <div class="card span-12" id="hero">
      <h2>Chargement...</h2>
      <div class="muted">Lecture des surfaces JSON.</div>
    </div>

    <div class="card span-8" id="reading"></div>
    <div class="card span-4" id="bias"></div>

    <div class="card span-12" id="timeProfiles"></div>

    <div class="card span-8" id="evidenceBus"></div>
    <div class="card span-4" id="risks"></div>

    <div class="card span-12" id="cockpit"></div>
  </section>

  <div class="footer">
    PowerFlow lit le flux. Le trader filtre, arbitre et agit.
  </div>
  <section class="card wide session-memory-card" id="sessionMemory"></section>

</main>

<script>
const SOURCES = {
  cockpit: "output/dashboard_surface/trader_cockpit.json",
  evidenceBus: "output/dashboard_surface/evidence_bus.json",
  evidenceReading: "output/dashboard_surface/evidence_reading.json",
  timeProfiles: "output/dashboard_surface/time_profiles_dashboard.json",
  phase: "output/dashboard_surface/phase_synthesis.json",
  b8: "output/dashboard_surface/b8_cross_surface.json",
  dataHealth: "output/dashboard_surface/data_health.json",
  contract: "output/dashboard_surface/dashboard_v74_contract_check.json"
};

function safe(v, fallback = "UNKNOWN") {
  if (v === null || v === undefined || v === "") return fallback;
  return v;
}

function esc(v) {
  return String(repairMojibake(safe(v, ""))).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[m]));
}

function repairMojibake(v) {
  let s = String(v ?? "");
  const map = {
    "Ã©": "é",
    "Ã¨": "è",
    "Ãª": "ê",
    "Ã«": "ë",
    "Ã ": "à",
    "Ã¢": "â",
    "Ã´": "ô",
    "Ã¹": "ù",
    "Ã»": "û",
    "Ã§": "ç",
    "Ã®": "î",
    "Ã¯": "ï",
    "â€™": "'",
    "â€œ": "“",
    "â€": "”",
    "â€“": "–",
    "â€”": "—",
    "Â°": "°",
    "Â": ""
  };
  for (const [bad, good] of Object.entries(map)) {
    s = s.split(bad).join(good);
  }
  return s;
}

function recursiveFind(obj, keys) {
  if (!obj || typeof obj !== "object") return null;

  if (Array.isArray(obj)) {
    for (const item of obj) {
      const found = recursiveFind(item, keys);
      if (found !== null && found !== undefined && found !== "") return found;
    }
    return null;
  }

  for (const key of keys) {
    if (Object.prototype.hasOwnProperty.call(obj, key)) {
      const v = obj[key];
      if (v !== null && v !== undefined && v !== "") return v;
    }
  }

  for (const v of Object.values(obj)) {
    const found = recursiveFind(v, keys);
    if (found !== null && found !== undefined && found !== "") return found;
  }

  return null;
}

function humanizeValue(v) {
  if (v === null || v === undefined || v === "") return "MISSING_FIELD";

  if (typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
    return String(v);
  }

  if (Array.isArray(v)) {
    return v.map(humanizeValue).filter(Boolean).join(" | ");
  }

  if (typeof v === "object") {
    const priority = [
      "risk",
      "code",
      "label",
      "name",
      "type",
      "message",
      "detail",
      "reason",
      "status",
      "field",
      "source"
    ];

    const parts = [];
    for (const k of priority) {
      if (v[k] !== null && v[k] !== undefined && v[k] !== "") {
        parts.push(`${k}=${humanizeValue(v[k])}`);
      }
    }

    if (parts.length) return parts.join(" | ");

    return Object.entries(v)
      .filter(([_, val]) => val !== null && val !== undefined && val !== "")
      .map(([k, val]) => `${k}=${humanizeValue(val)}`)
      .join(" | ") || "EMPTY_OBJECT";
  }

  return String(v);
}

function normalizeList(v) {
  if (v === null || v === undefined || v === "") return [];

  if (Array.isArray(v)) {
    return v.map(humanizeValue).filter(x => x && x !== "EMPTY_OBJECT");
  }

  if (typeof v === "object") {
    return [humanizeValue(v)].filter(Boolean);
  }

  return String(v || "")
    .split("|")
    .map(x => x.trim())
    .filter(Boolean);
}

function badgeClass(v) {
  const s = String(v || "").toUpperCase();
  if (s.includes("WAKE") || s.includes("ALERT")) return "wake";
  if (s.includes("HOT") || s.includes("ACTIVE")) return "hot";
  if (s.includes("WATCH")) return "watch";
  if (s.includes("OK") || s.includes("VALIDATED")) return "ok";
  if (s.includes("CONFLICT") || s.includes("DEGRADED") || s.includes("RISK")) return "bad";
  if (s.includes("COUNTER") || s.includes("DIVERGENT")) return "purple";
  return "";
}

async function loadJson(path) {
  try {
    const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return {};
    return await r.json();
  } catch {
    return {};
  }
}

function parseTime(v) {
  if (!v) return null;
  const t = Date.parse(v);
  if (Number.isNaN(t)) return null;
  return t;
}

function newestTimestamp(...objects) {
  let best = null;
  for (const obj of objects) {
    if (!obj || typeof obj !== "object") continue;
    const candidates = [
      obj.timestamp_utc,
      obj.updated_utc,
      obj.created_utc,
      obj.last_update_utc,
      obj.generated_utc
    ];
    for (const c of candidates) {
      const t = parseTime(c);
      if (t !== null && (best === null || t > best)) best = t;
    }
  }
  return best;
}

function ageSeconds(ts) {
  if (ts === null) return null;
  return Math.max(0, Math.round((Date.now() - ts) / 1000));
}

function freshnessLabel(age, healthStatus) {
  const hs = String(healthStatus || "").toUpperCase();
  if (hs.includes("STALE")) return hs;
  if (age === null) return "UNKNOWN_FRESHNESS";
  if (age <= 30) return "FRESH";
  if (age <= 180) return "WARM";
  return "STALE_VIEW";
}

function renderStatusBar(contract, health, latestTs, age) {
  const contractStatus = safe(contract.status, "UNKNOWN");
  const healthStatus = safe(health.global_status || health.status, "UNKNOWN");
  const freshness = freshnessLabel(age, healthStatus);
  const latestIso = latestTs ? new Date(latestTs).toISOString() : "UNKNOWN";

  return `
    <div class="statusbar">
      <span class="badge ok"><span class="pulse"></span>AUTO REFRESH 10s</span>
      <span class="badge ${badgeClass(contractStatus)}">CONTRACT=${esc(contractStatus)}</span>
      <span class="badge ${badgeClass(healthStatus)}">DATA_HEALTH=${esc(healthStatus)}</span>
      <span class="badge ${badgeClass(freshness)}">FRESHNESS=${esc(freshness)}</span>
      <span class="badge">AGE=${esc(age === null ? "UNKNOWN" : age + "s")}</span>
      <span class="badge mono">LAST=${esc(latestIso)}</span>
    </div>
  `;
}

function renderHero(reading, bus, cockpit, contract, health, latestTs, age) {
  const attention = safe(reading.attention || bus.global_attention || cockpit.action, "INFO");
  const phase = safe(reading.phase || bus.dominant_phase, "UNKNOWN");
  const bias = safe(reading.bias || bus.dashboard_bias || bus.dominant_bias, "UNKNOWN");
  const structural = safe(reading.structural_bias || bus.structural_bias, "UNKNOWN");
  const counter = safe(reading.counterflow_bias || bus.counterflow_bias, "UNKNOWN");
  const warning = safe(reading.semantic_warning || bus.semantic_warning, "NONE");

  document.getElementById("hero").innerHTML = `
    <h2>Bandeau décisionnel</h2>
    <div class="bigline">
      <span class="badge ${badgeClass(attention)}">${esc(attention)}</span>
      <span class="badge ${badgeClass(phase)}">${esc(phase)}</span>
      <span class="badge ${badgeClass(bias)}">dashboard_bias=${esc(bias)}</span>
      <span class="badge">structure=${esc(structural)}</span>
      <span class="badge purple">counterflow=${esc(counter)}</span>
      <span class="badge ${badgeClass(warning)}">${esc(warning)}</span>
    </div>
    <div class="kv">
      <div class="k">État cockpit</div><div class="v">${esc(recursiveFind(cockpit, ["state", "etat", "main_state", "market_state", "synthesis"]) || "MISSING_FIELD")}</div>
      <div class="k">Confiance</div><div class="v">${esc(reading.confidence || bus.confidence)}</div>
      <div class="k">Dernière mise à jour</div><div class="v mono">${esc(bus.timestamp_utc || reading.timestamp_utc || cockpit.timestamp_utc)}</div>
    </div>
    ${renderStatusBar(contract, health, latestTs, age)}
  `;
}

function renderReading(reading) {
  const watch = Array.isArray(reading.watch) ? reading.watch : [];
  document.getElementById("reading").innerHTML = `
    <h2>Lecture trader</h2>
    <div class="phrase">${esc(reading.phrase || "Aucune phrase Evidence Reading disponible.")}</div>
    <h3>À surveiller</h3>
    <ul>${watch.map(x => `<li>${esc(x)}</li>`).join("") || "<li class='muted'>Aucun watch item.</li>"}</ul>
  `;
}

function renderBias(reading, bus, b8) {
  document.getElementById("bias").innerHTML = `
    <h2>Biais sémantique</h2>
    <div class="kv">
      <div class="k">Dashboard</div><div class="v">${esc(reading.bias || bus.dashboard_bias)}</div>
      <div class="k">Structure</div><div class="v">${esc(reading.structural_bias || bus.structural_bias)}</div>
      <div class="k">Counterflow</div><div class="v">${esc(reading.counterflow_bias || bus.counterflow_bias)}</div>
      <div class="k">Dominant brut</div><div class="v">${esc(bus.dominant_bias)}</div>
      <div class="k">B8</div><div class="v">${esc(b8.status || b8.coverage || "UNKNOWN")}</div>
    </div>
  `;
}

function renderTimeProfiles(tp) {
  const profiles = Array.isArray(tp.profiles) ? tp.profiles : [];

  const cards = profiles.map(p => {
    const tfs = p.timeframes || {};
    const rows = Object.keys(tfs).map(tf => {
      const x = tfs[tf] || {};
      const broker = x.timestamp_broker || x.last_timestamp_broker || "";
      const local = x.timestamp_local_reference || x.last_timestamp_local_reference || x.last_timestamp_utc || "";
      return `
        <tr>
          <td><b>${esc(tf)}</b><br><span class="muted">${esc(x.role)}</span></td>
          <td>${esc(x.phase)}</td>
          <td>${esc(x.bias)}</td>
          <td>${esc(x.important_event)}</td>
          <td>${esc(x.last_close)}</td>
          <td class="mono small">${esc(broker || local)}</td>
          <td>${esc((x.technical_risks || []).join(", "))}</td>
        </tr>
      `;
    }).join("");

    return `
      <h3>${esc(p.profile)} — ${esc(p.main_state)} — ${esc(p.dominant_bias)} — fake=${esc(p.fake_risk)}</h3>
      <table>
        <thead>
          <tr>
            <th>TF</th><th>Phase</th><th>Biais</th><th>Event</th><th>Prix</th><th>Temps</th><th>Risques</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }).join("");

  document.getElementById("timeProfiles").innerHTML = `
    <h2>Profils temps</h2>
    ${cards || "<div class='muted'>Aucun profil temps disponible.</div>"}
  `;
}

function renderEvidenceBus(bus) {
  const evidence = Array.isArray(bus.evidence) ? bus.evidence : [];
  const rows = evidence.map(e => {
    const weight = Number(e.weight || 0);
    const pct = Math.max(0, Math.min(100, weight * 100));
    const details = e.details || {};
    return `
      <tr>
        <td><b>${esc(e.layer)}</b><br><span class="muted">${esc(e.message)}</span></td>
        <td>${esc(e.attention)}</td>
        <td>${esc(e.state)}</td>
        <td>${esc(e.bias)}</td>
        <td>
          <div class="weight"><div class="bar" style="width:${pct}%"></div></div>
          <span class="mono">${esc(e.weight)}</span>
        </td>
        <td class="small">${esc(details.fake_risk || details.coverage || "")}</td>
      </tr>
    `;
  }).join("");

  document.getElementById("evidenceBus").innerHTML = `
    <h2>Evidence Bus</h2>
    <table>
      <thead>
        <tr>
          <th>Couche</th><th>Attention</th><th>État</th><th>Biais</th><th>Poids</th><th>Détail</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderRisks(reading, bus, health) {
  const risks = new Set();
  for (const r of (reading.technical_risks || [])) risks.add(r);
  for (const r of (bus.technical_risks || [])) risks.add(r);

  const healthIssues = health.issues || health.technical_risks || [];
  for (const r of healthIssues) risks.add(typeof r === "string" ? r : JSON.stringify(r));

  document.getElementById("risks").innerHTML = `
    <h2>Risques techniques utiles</h2>
    <ul>
      ${Array.from(risks).map(r => `<li>${esc(r)}</li>`).join("") || "<li class='muted'>Aucun risque remonté.</li>"}
    </ul>
  `;
}

function renderCockpit(cockpit) {
  const action = recursiveFind(cockpit, ["action", "attention", "status", "decision"]) || "MISSING_FIELD";
  const state = recursiveFind(cockpit, ["state", "etat", "main_state", "market_state"]) || "MISSING_FIELD";
  const reading = recursiveFind(cockpit, ["reading", "synthesis", "multiread_synthesis", "reading_type"]) || "MISSING_FIELD";

  const scenarios =
    recursiveFind(cockpit, ["scenarios", "watch_scenarios"]) ||
    recursiveFind(cockpit, ["scenario_lines"]) ||
    [];

  const risks =
    recursiveFind(cockpit, ["risks", "technical_risks", "useful_risks"]) ||
    [];

  const normalizedScenarios = normalizeList(scenarios);
  const normalizedRisks = normalizeList(risks);

  document.getElementById("cockpit").innerHTML = `
    <h2>Cockpit source</h2>
    <div class="kv">
      <div class="k">Action</div><div class="v">${esc(action)}</div>
      <div class="k">State</div><div class="v">${esc(state)}</div>
      <div class="k">Reading</div><div class="v">${esc(reading)}</div>
    </div>
    <h3>Scénarios</h3>
    <ul>${normalizedScenarios.map(x => `<li>${esc(x)}</li>`).join("") || "<li class='muted'>MISSING_FIELD: cockpit.scenarios</li>"}</ul>
    <h3>Risques cockpit</h3>
    <ul>${normalizedRisks.map(x => `<li>${esc(x)}</li>`).join("") || "<li class='muted'>Aucun risque cockpit direct.</li>"}</ul>
  `;
}

async function main() {
  const [cockpit, evidenceBus, evidenceReading, timeProfiles, phase, b8, dataHealth, contract] = await Promise.all([
    loadJson(SOURCES.cockpit),
    loadJson(SOURCES.evidenceBus),
    loadJson(SOURCES.evidenceReading),
    loadJson(SOURCES.timeProfiles),
    loadJson(SOURCES.phase),
    loadJson(SOURCES.b8),
    loadJson(SOURCES.dataHealth),
    loadJson(SOURCES.contract)
  ]);

  const latestTs = newestTimestamp(cockpit, evidenceBus, evidenceReading, timeProfiles, phase, b8, dataHealth, contract);
  const age = ageSeconds(latestTs);

  renderHero(evidenceReading, evidenceBus, cockpit, contract, dataHealth, latestTs, age);
  renderReading(evidenceReading);
  renderBias(evidenceReading, evidenceBus, b8);
  renderTimeProfiles(timeProfiles);
  renderEvidenceBus(evidenceBus);
  renderRisks(evidenceReading, evidenceBus, dataHealth);
  renderCockpit(cockpit);
}

main().catch(err => {
  document.getElementById("hero").innerHTML = `<h2 class="error">Erreur dashboard</h2><pre>${esc(err.stack || err)}</pre>`;
});

setInterval(() => {
  main().catch(err => {
    console.error("dashboard_refresh_error", err);
  });
}, 10000);

async function pf75LoadJson(path) {
  try {
    const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    return null;
  }
}

function pf75Esc(v) {
  const clean = (typeof pf75HumanText === "function") ? pf75HumanText(v) : (v === null || v === undefined ? "" : String(v));
  return String(clean)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function pf75Find(obj, keys) {
  if (!obj || typeof obj !== "object") return null;
  const wanted = new Set(keys);
  const stack = [obj];

  while (stack.length) {
    const cur = stack.pop();
    if (!cur || typeof cur !== "object") continue;

    for (const [k, v] of Object.entries(cur)) {
      if (wanted.has(k)) return v;
      if (v && typeof v === "object") stack.push(v);
    }
  }
  return null;
}

function pf75Events(mem) {
  const candidates = [
    pf75Find(mem, ["last_events"]),
    pf75Find(mem, ["events"]),
    pf75Find(mem, ["recent_important_events"])
  ];

  for (const c of candidates) {
    if (Array.isArray(c)) return c.slice(-8).reverse();
  }
  return [];
}

function pf75ReviewBlock(mem) {
  const review = pf75Find(mem, ["trader_review", "review", "revue_trader"]) || {};
  const fields = [
    ["Ce que j'ai vu", "what_i_saw"],
    ["Ce que j'ai ressenti", "what_i_felt"],
    ["Ce que PowerFlow a vu avant moi", "what_powerflow_saw_before_me"],
    ["Ce que PowerFlow a raté", "what_powerflow_missed"],
    ["Leçon", "lesson"]
  ];

  return `
    <div class="muted" style="margin-top:10px">
      <b>Revue trader prête :</b>
      ${fields.map(([label, key]) => `<span class="pill">${pf75Esc(label)}${review[key] ? " ✓" : ""}</span>`).join(" ")}
    </div>
  `;
}

function pf75ProfileMemory(name, mem) {
  const events = pf75Events(mem);
  const total = pf75Find(mem, ["events_total"]) ?? events.length;
  const updated = pf75Find(mem, ["updated_utc", "timestamp_utc", "last_update_utc"]) || "";
  const visible = events.slice(0, 3);
  const hidden = events.length > 3 ? events.slice(3) : [];

  function row(e) {
    const ts = e.timestamp_broker || e.timestamp_local_reference || e.timestamp_utc || "";
    const tf = e.timeframe || "";
    const event = e.event_type || e.important_event || "";
    const phase = e.phase_after || e.phase || e.tf_phase || "";
    const bias = e.bias || e.dominant_bias || "";
    const price = e.price ?? e.last_close ?? "";
    const phrase = e.machine_phrase || e.cockpit_phrase || "";

    return `
      <tr>
        <td><b>${pf75Esc(tf)}</b></td>
        <td>${pf75Esc(event)}</td>
        <td>${pf75Esc(phase)}</td>
        <td>${pf75Esc(bias)}</td>
        <td>${pf75Esc(price)}</td>
        <td>${pf75Esc(ts)}</td>
        <td class="muted">${pf75Esc(phrase)}</td>
      </tr>
    `;
  }

  const visibleRows = visible.map(row).join("");
  const hiddenRows = hidden.map(row).join("");

  return `
    <details class="profile-memory" ${name === "LTF" ? "open" : ""}>
      <summary>
        ${pf75Esc(name)} Session Memory
        <span class="mini-note">events=${pf75Esc(total)} · updated=${pf75Esc(updated)} · visible=${visible.length}/${events.length}</span>
      </summary>

      <table>
        <thead>
          <tr>
            <th>TF</th>
            <th>Event</th>
            <th>Phase</th>
            <th>Bias</th>
            <th>Prix</th>
            <th>Temps</th>
            <th>Machine</th>
          </tr>
        </thead>
        <tbody>
          ${visibleRows || `<tr><td colspan="7" class="muted">Aucun moment marquant en mémoire.</td></tr>`}
          ${hiddenRows ? `<tr><td colspan="7" class="muted">— événements plus anciens —</td></tr>${hiddenRows}` : ""}
        </tbody>
      </table>

      <div class="review-line">
        Revue trader prête : Ce que j'ai vu · Ce que j'ai ressenti · Ce que PowerFlow a vu avant moi · Ce que PowerFlow a raté · Leçon
      </div>
    </details>
  `;
}

async function renderSessionMemory() {
  const el = document.getElementById("sessionMemory");
  if (!el) return;

  const paths = [
    ["LTF", "output/dashboard_surface/GBPUSD/ltf_session_memory.json"],
    ["MTF", "output/dashboard_surface/GBPUSD/mtf_session_memory.json"],
    ["HTF", "output/dashboard_surface/GBPUSD/htf_session_memory.json"]
  ];

  const loaded = await Promise.all(paths.map(async ([name, path]) => [name, await pf75LoadJson(path)]));

  el.innerHTML = `
    <h2>Session Memory</h2>
    <p class="muted">Film de session conservé pour comparaison trader / machine.</p>
    ${loaded.map(([name, mem]) => pf75ProfileMemory(name, mem || {})).join("")}
  `;
}

setTimeout(() => {
  try { renderSessionMemory(); } catch (e) { console.error("session memory render failed", e); }
}, 800);


function pf75HumanText(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "object") {
    if (v.label) return pf75HumanText(v.label);
    if (v.message) return pf75HumanText(v.message);
    if (v.code) return pf75HumanText(v.code);
    try { return JSON.stringify(v); } catch (e) { return ""; }
  }

  let s = String(v);
  s = s.replace(/^label=/i, "");
  s = s.replace(/^message=/i, "");
  s = s.replace(/^code=/i, "");
  s = s.replaceAll("Ã¨", "è")
       .replaceAll("Ã©", "é")
       .replaceAll("Ãª", "ê")
       .replaceAll("Ã ", "à")
       .replaceAll("Ã§", "ç")
       .replaceAll("Ã´", "ô")
       .replaceAll("â€™", "'")
       .replaceAll("â€œ", '"')
       .replaceAll("â€", '"');
  return s;
}


function pf75CleanVisibleLeaks() {
  const root = document.body;
  if (!root) return;

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  for (const n of nodes) {
    if (!n.nodeValue) continue;
    let s = n.nodeValue;
    s = s.replace(/\blabel=/gi, "");
    s = s.replace(/\bmessage=/gi, "");
    s = s.replace(/\bcode=/gi, "");
    s = s.replaceAll("Ã¨", "è")
         .replaceAll("Ã©", "é")
         .replaceAll("Ãª", "ê")
         .replaceAll("Ã ", "à")
         .replaceAll("Ã§", "ç")
         .replaceAll("Ã´", "ô")
         .replaceAll("â€™", "'")
         .replaceAll("â€œ", '"')
         .replaceAll("â€", '"');
    if (s !== n.nodeValue) n.nodeValue = s;
  }
}

setInterval(pf75CleanVisibleLeaks, 1500);
setTimeout(pf75CleanVisibleLeaks, 500);
setTimeout(pf75CleanVisibleLeaks, 2000);
